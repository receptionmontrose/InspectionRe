<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Inspection Report</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inspection">

<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2a44;--mute:#5a6a8a;--line:#c9d3e6;--acc:#1f4e9c;--accink:#fff;--ph:#f2f5fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--card:#1b2130;--ink:#e8edf8;--mute:#9fb0cf;--line:#34405a;--acc:#6f9cf0;--accink:#0d1426;--ph:#222a3d}}
:root[data-theme="dark"]{--bg:#12161f;--card:#1b2130;--ink:#e8edf8;--mute:#9fb0cf;--line:#34405a;--acc:#6f9cf0;--accink:#0d1426;--ph:#222a3d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1150px;margin:0 auto;padding:14px}
h1{margin:6px 0 0;text-align:center;font-size:22px;letter-spacing:.5px;color:var(--acc)}
.sub{text-align:center;color:var(--mute);font-style:italic;margin:2px 0 12px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
label.f{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:2px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{resize:vertical;min-height:44px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;display:grid;gap:8px}
.num{font-size:12px;font-weight:700;color:var(--mute)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frame{aspect-ratio:5/7;border:2px dashed var(--line);border-radius:8px;background:var(--ph);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mute);font-size:13px;text-align:center}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.btns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.btns button.add{flex:1 1 100%}
.btns button.sec{flex:1 1 0}
.frame{white-space:pre-line}
.frame:focus{outline:3px solid var(--acc);outline-offset:1px}
.frame.over{border-color:var(--acc);background:var(--card)}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 10px;background:var(--acc);color:var(--accink);cursor:pointer;flex:1}
button.sec{background:transparent;color:var(--acc);border:1px solid var(--acc);flex:0 0 auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.bar button{flex:1 1 140px}
.hint{font-size:12.5px;color:var(--mute);margin:0 0 10px}
.prep{margin-top:6px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}
#modal[hidden]{display:none}
.mbox{background:var(--card);color:var(--ink);border-radius:14px;padding:18px;max-width:380px;width:100%}
.mbox p{margin:0 0 14px;font-size:16px;white-space:pre-wrap}
.sigbox{margin-top:12px}
.sigprev{height:96px;border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff;color:#667;font-size:13px}
.sigprev img{max-height:84px;max-width:92%}
@media (min-width:760px){
 .meta{grid-template-columns:repeat(4,1fr)}
 .row{grid-template-columns:90px 1.7fr 80px 1.7fr 2.6fr;align-items:start}
 .num{display:none}
}
/* ---------- PRINT SHEET: copy of the Word report layout ---------- */
#sheet{display:none}
@media print{
 @page{size:A4 landscape;margin:0}
 html,body{margin:0;padding:0;background:#fff}
 .wrap{display:none!important}
 #sheet{display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact;color:#000;background:#fff}
 #sheet table{border-collapse:collapse;table-layout:fixed}
 .pg{width:100%}.sp{height:30pt}.pgc{padding:0 30pt}
 .t1{font:bold 18pt Calibri,Carlito,Arial,sans-serif;color:#1F3864;text-align:center;margin:0 0 4pt}
 .t2{font:italic 12pt Calibri,Carlito,Arial,sans-serif;color:#555;text-align:center;border-bottom:1pt solid #1F3864;padding-bottom:1pt;margin:0 0 12pt}
 .it{width:750pt}
 .it td,.dt td,.sg td{border:.5pt solid #8EAADB;padding:4pt 5pt;vertical-align:middle;overflow-wrap:anywhere}
 .it .l{background:#D9E2F3;font:bold 11pt Calibri,Carlito,Arial,sans-serif}
 .it .v,.dt td{font:10pt "Times New Roman","Liberation Serif",Times,serif}
 .it tr:nth-child(1){height:48pt}.it tr:nth-child(2){height:44.65pt}
 .dt{width:825pt;margin:14pt 0 0 -21.55pt}
 .dt td{text-align:center;white-space:pre-wrap}
 .dt tr{break-inside:avoid;page-break-inside:avoid;height:60pt}
 .ph{display:flex;justify-content:center;gap:6pt}
 .fr{width:144pt;height:201.6pt;flex:0 0 auto}
 .fr img{width:100%;height:100%;object-fit:cover;display:block}
 .sg{width:500pt;margin:12pt auto 0;break-inside:avoid}
 .sg tr{height:55pt}
 .sg td{font:11pt Calibri,Carlito,Arial,sans-serif;width:250pt}
}
</style>
</head>
<body>
<div class="wrap">
 <h1>SITE INSPECTION REPORT</h1>
 <div class="sub">Issues Log with Photographic Evidence</div>
 <div class="meta">
  <div><label class="f">Project / Site</label><input id="proj"></div>
  <div><label class="f">Report No.</label><input id="rep"></div>
  <div><label class="f">Inspected By</label><select id="by"><option>Day Shift Security Team</option><option>Night Shift Security Team</option></select></div>
  <div><label class="f">Inspection Date</label><input id="date" type="date"></div>
 </div>
 <div id="rows"></div>
 <div class="bar">
  <button id="add" class="sec">+ Add row</button>
  <button id="word">Download Word file</button>
  <button id="pdf" class="sec">Download PDF</button>
  <button id="clear" class="sec">New blank report</button>
 </div>
 <p class="hint">Download Word file puts everything into your report file, ready to send. Download PDF makes a PDF copy. Empty rows are left out.</p>
 <div class="prep"><label class="f">Prepared By (Name &amp; Signature)</label><input id="prep"></div>
 <div class="sigbox"><label class="f">Signature</label><div id="sigprev" class="sigprev"></div><div class="btns"><button id="sigadd">Add signature photo</button><button id="sigrm" class="sec">Remove</button></div><p class="hint">Sign on plain white paper, take a clear photo, and add it. The paper background is removed automatically.</p></div>
 <input id="sigfile" type="file" accept="image/*" hidden>
<div id="modal" hidden><div class="mbox"><p id="mmsg"></p><div class="btns"><button id="mno" class="sec"></button><button id="myes"></button></div></div></div>
 <input id="file" type="file" accept="image/*" hidden>
</div>
<div id="sheet"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
var KEY="dair-v1";
function blank(){return {t:"",a:"",y:"",r:"",p:[null,null]};}
function fresh(){var d=new Date();var iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
 return {proj:"Mont Rose Residences – Tower A & B",rep:"",by:"Day Shift Security Team",date:iso,prep:"Shreesti",rows:[blank(),blank(),blank(),blank(),blank()]};}
var S=null;
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw);}catch(e){}
if(!S||!S.rows)S=fresh();
if(S.proj==="Montrose"||S.proj==="Mont Rose")S.proj="Mont Rose Residences \u2013 Tower A & B";
if(S.by==="Day Shift Security")S.by="Day Shift Security Team";
(function(){var sel=document.getElementById("by");if(S.by&&!Array.prototype.some.call(sel.options,function(o){return o.value===S.by;})){var o=document.createElement("option");o.textContent=S.by;sel.appendChild(o);}})();
function autoRep(){var d=(S.date||"").replace(/-/g,"");return d?"DAIR-"+d+"-"+(/night/i.test(S.by||"")?"N":"D"):"";}
if(S.repAuto===undefined)S.repAuto=!S.rep;
if(S.repAuto)S.rep=autoRep();
var saveNote=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){if(!saveNote){saveNote=true;say("Photos are too large to keep in this browser. Save as PDF before closing the page.");}}}

function dlg(msg,yes,no){return new Promise(function(res){var m=document.getElementById("modal"),y=document.getElementById("myes"),n=document.getElementById("mno");document.getElementById("mmsg").textContent=msg;y.textContent=yes;n.textContent=no||"";n.style.display=no?"":"none";m.hidden=false;function done(v){m.hidden=true;y.onclick=null;n.onclick=null;res(v);}y.onclick=function(){done(true);};n.onclick=function(){done(false);};});}
function ask(msg,yes){return dlg(msg,yes||"Yes","Cancel");}
function say(msg){return dlg(msg,"OK",null);}
var rowsEl=document.getElementById("rows"),fileEl=document.getElementById("file"),target=null;
["proj","rep","by","date","prep"].forEach(function(k){var el=document.getElementById(k);el.value=S[k]||"";el.addEventListener("input",function(){S[k]=el.value;save();});});
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function field(label,el){var w=mk("div");w.appendChild(mk("label","f",label));w.appendChild(el);return w;}
var AREAS=[
["Rooftop",["MEP Room – Tower A – Rooftop","Domestic Water Pump Room (MEP Room) – Tower A – Rooftop","MEP Room – Tower B – Rooftop","Domestic Water Pump Room (MEP Room) – Tower B – Rooftop","Gym – Tower A – Rooftop","Gym – Tower B – Rooftop","Swimming Pool – Tower A – Rooftop","Swimming Pool – Tower B – Rooftop"]],
["Ground Floor",["Reception – Tower A","Reception – Tower B","CCTV Room (Control Room) – Tower A","CCTV Room (Control Room) – Tower B","DEWA Substation – Tower A","DEWA Substation – Tower B","Generator Room – Tower A","Front Driveway – Tower A","Front Driveway – Tower B","Rear Side Driveway / Perimeter – Tower A","Rear Side Driveway / Perimeter – Tower B","Garbage Room – Tower A","Garbage Room – Tower B","Park Area (between Tower A and Tower B)"]],
["Lift Lobbies",["Lift Lobby – Tower A – Rooftop","Lift Lobby – Tower B – Rooftop","Lift Lobby – Tower A – Basement 1","Lift Lobby – Tower A – Basement 2","Lift Lobby – Tower A – Basement 3","Lift Lobby – Tower B – Basement 1","Lift Lobby – Tower B – Basement 2","Lift Lobby – Tower B – Basement 3"]],
["Lifts",["Service Lift – Tower A","Passenger Lift 1 – Tower A","Passenger Lift 2 – Tower A","Service Lift – Tower B","Passenger Lift 1 – Tower B","Passenger Lift 2 – Tower B"]],
["Basement 1",["Basement 1 Parking","Chilled Water Pump Room – Tower A – Basement 1","Low Voltage (LV) Room – Tower A – Basement 1","Low Voltage (LV) Room – Tower B – Basement 1","Energy / Thermal Transfer Station (ETS) Room – Tower A – Basement 1"]],
["Basement 2",["Basement 2 Parking"]],
["Basement 3",["Basement 3 Parking","Domestic Water Pump Room – Tower A – Basement 3","Fire Pump Room – Tower A – Basement 3","Irrigation Pump Room – Tower B – Basement 3"]]
],AFLAT=[];AREAS.forEach(function(g){g[1].forEach(function(n){AFLAT.push(n);});});
var REMARKS=[
["Normal",["In normal condition"]],
["Cleaning",["Needs cleaning","Needs washing","Garbage to be removed"]],
["Water",["Water pooling","Water leakage","Water damage","Seepage on wall / ceiling"]],
["Repairs",["Needs rectification","Needs maintenance","Light not working","Door needs fixing","Damaged – needs repair"]],
["Pending",["Pending – reported to maintenance","Pending – awaiting contractor","Pending – awaiting spare parts / material","Pending – awaiting management approval"]],
["Follow Up",["Follow-up required","Follow-up with maintenance team","Follow-up with management","To be rechecked on next patrol"]],
["Safety",["Obstruction / blocked access","Abnormal noise or smell","Door left open / unsecured","Fire safety item missing or damaged"]]
],RFLAT=[];REMARKS.forEach(function(g){g[1].forEach(function(n){RFLAT.push(n);});});
function remarkText(r){var d=(r.rd||"").trim();return d?(r.r?r.r+" – "+d:d):(r.r||"");}
var active=null;
function makeFrame(i,s,src,asp){
 var fr=mk("div","frame");fr.tabIndex=0;if(asp)fr.style.aspectRatio=String(asp);
 if(src){var im=document.createElement("img");im.src=src;im.alt="Photo "+(s+1);fr.appendChild(im);}else fr.textContent="No photo\n(drop or paste here)";
 fr.onfocus=function(){active=[i,s];};
 fr.ondragover=function(e){e.preventDefault();fr.classList.add("over");};
 fr.ondragleave=function(){fr.classList.remove("over");};
 fr.ondrop=function(e){e.preventDefault();fr.classList.remove("over");var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f&&f.type.indexOf("image")===0)setPhoto(i,s,f);};
 return fr;
}
function makeBtns(i,s,has,addLabel){
 var b=mk("div","btns"),add=mk("button","add",has?"Replace photo":(addLabel||"Add photo"));
 add.onclick=function(){target=[i,s];fileEl.value="";fileEl.click();};b.appendChild(add);
 var pb=mk("button","sec","Paste");
 pb.onclick=async function(){
  try{
   if(!navigator.clipboard||!navigator.clipboard.read){await say("Paste is not available in this browser. Use Add photo instead.");return;}
   var items=await navigator.clipboard.read();
   for(var q=0;q<items.length;q++){var ty=items[q].types.filter(function(t){return t.indexOf("image/")===0;})[0];if(ty){setPhoto(i,s,await items[q].getType(ty));return;}}
   await say("No picture found. Copy a picture first, then tap Paste.");
  }catch(e){await say("Could not read the clipboard. Allow paste if asked, or use Add photo.");}
 };
 b.appendChild(pb);
 if(has){var rm=mk("button","sec","Remove");rm.onclick=function(){var rw=S.rows[i];rw.p[s]=null;if(rw.pa)rw.pa[s]=null;save();render();};b.appendChild(rm);}
 return b;
}
function firstEmpty(){for(var i=0;i<S.rows.length;i++)for(var s=0;s<2;s++)if(!S.rows[i].p[s])return [i,s];return null;}
function setPhoto(i,s,blob){
 var url=URL.createObjectURL(blob),img=new Image();
 img.onload=function(){
  var M=1100,sc=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
  var c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  var rw=S.rows[i];if(!rw){URL.revokeObjectURL(url);return;}
  rw.p[s]=c.toDataURL("image/jpeg",0.8);rw.pa=rw.pa||[null,null];rw.pa[s]=c.width/c.height;
  URL.revokeObjectURL(url);save();render();
 };
 img.onerror=function(){say("Could not read that picture.");};
 img.src=url;
}
document.addEventListener("paste",function(e){
 var items=(e.clipboardData&&e.clipboardData.items)||[];
 for(var k=0;k<items.length;k++){if(items[k].type.indexOf("image")===0){var f=items[k].getAsFile();if(!f)continue;
  var tg=active||firstEmpty();active=null;
  if(tg){e.preventDefault();setPhoto(tg[0],tg[1],f);}else say("All photo frames are full. Tap Add row first.");
  return;}}
});
document.addEventListener("dragover",function(e){e.preventDefault();});
document.addEventListener("drop",function(e){e.preventDefault();});
function render(){
 rowsEl.innerHTML="";
 S.rows.forEach(function(row,i){
  var box=mk("div","row");
  box.appendChild(mk("div","num","Row "+(i+1)));
  var t=document.createElement("input");t.type="time";t.value=row.t;t.oninput=function(){row.t=t.value;save();};
  var a=document.createElement("select"),ai=document.createElement("input"),aw=document.createElement("div");
  var o0=mk("option","","Select area…");o0.value="";a.appendChild(o0);
  AREAS.forEach(function(g){var og=document.createElement("optgroup");og.label=g[0];g[1].forEach(function(n){var o=mk("option","",n);o.value=n;og.appendChild(o);});a.appendChild(og);});
  var oo=mk("option","","Other (type it)…");oo.value="__other";a.appendChild(oo);
  var isOther=!!row.ao||(row.a&&AFLAT.indexOf(row.a)<0);
  a.value=isOther?"__other":row.a;ai.placeholder="Type the area";ai.style.marginTop="6px";ai.style.display=isOther?"":"none";ai.value=isOther?row.a:"";
  a.onchange=function(){if(a.value==="__other"){row.ao=true;row.a="";ai.style.display="";ai.value="";ai.focus();}else{row.ao=false;row.a=a.value;ai.style.display="none";}save();};
  ai.oninput=function(){row.a=ai.value;row.ao=true;save();};
  aw.appendChild(a);aw.appendChild(ai);
  var y=document.createElement("select");["","Yes","No"].forEach(function(v){var o=mk("option","",v||"-");o.value=v;y.appendChild(o);});y.value=row.y;y.onchange=function(){row.y=y.value;save();};
  var r=document.createElement("select"),ri=document.createElement("input"),rdi=document.createElement("input"),rw=document.createElement("div");
  var p0=mk("option","","Select remark…");p0.value="";r.appendChild(p0);
  REMARKS.forEach(function(g){var og=document.createElement("optgroup");og.label=g[0];g[1].forEach(function(n){var o=mk("option","",n);o.value=n;og.appendChild(o);});r.appendChild(og);});
  var po=mk("option","","Other (type it)…");po.value="__other";r.appendChild(po);
  var rOther=!!row.ro||(row.r&&RFLAT.indexOf(row.r)<0);
  r.value=rOther?"__other":row.r;ri.placeholder="Type the remark";ri.style.marginTop="6px";ri.style.display=rOther?"":"none";ri.value=rOther?row.r:"";
  rdi.placeholder="Optional detail (e.g. near column 5)";rdi.style.marginTop="6px";rdi.value=row.rd||"";
  r.onchange=function(){
   if(r.value==="__other"){row.ro=true;row.r="";ri.style.display="";ri.value="";ri.focus();row.y="Yes";y.value="Yes";}
   else{row.ro=false;row.r=r.value;ri.style.display="none";if(r.value){row.y=(r.value==="In normal condition")?"No":"Yes";y.value=row.y;}}
   save();};
  ri.oninput=function(){row.r=ri.value;row.ro=true;save();};
  rdi.oninput=function(){row.rd=rdi.value;save();};
  rw.appendChild(r);rw.appendChild(ri);rw.appendChild(rdi);
  box.appendChild(field("Time",t));box.appendChild(field("Area",aw));box.appendChild(field("Issue? (Yes/No)",y));box.appendChild(field("Remarks",rw));
  var ph=mk("div","photos"),np=(row.p[0]?1:0)+(row.p[1]?1:0),ws=-1;
  if(np===1){var si=row.p[0]?0:1,pa=row.pa&&row.pa[si];
   if(pa>1)ws=si;
   else if(!pa){(function(rw,sj){loadImg(rw.p[sj]).then(function(im){rw.pa=rw.pa||[null,null];rw.pa[sj]=im.naturalWidth/im.naturalHeight;save();render();});})(row,si);}}
  if(ws>=0){
   var wc=mk("div");wc.style.gridColumn="1 / -1";wc.appendChild(makeFrame(i,ws,row.p[ws],Math.max(row.pa[ws],1.3364)));wc.appendChild(makeBtns(i,ws,true));ph.appendChild(wc);
   var oc=mk("div");oc.style.gridColumn="1 / -1";oc.appendChild(mk("div","hint","Second photo (optional)"));oc.appendChild(makeBtns(i,1-ws,false,"Add second photo"));ph.appendChild(oc);
  }else{
   [0,1].forEach(function(s){var cell=mk("div");cell.appendChild(makeFrame(i,s,row.p[s]));cell.appendChild(makeBtns(i,s,!!row.p[s]));ph.appendChild(cell);});
  }
  box.appendChild(ph);
  var del=mk("button","sec","Delete row");
  del.onclick=async function(){if(await ask("Delete row "+(i+1)+"?","Delete")){S.rows.splice(i,1);if(!S.rows.length)S.rows.push(blank());save();render();}};
  box.appendChild(del);
  rowsEl.appendChild(box);
 });
}
fileEl.addEventListener("change",function(){var f=fileEl.files&&fileEl.files[0];if(f&&target)setPhoto(target[0],target[1],f);});
/* ---- print sheet ---- */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmtTime(v){if(!v)return "";var p=v.split(":"),h=+p[0],ap=h>=12?"PM":"AM";h=h%12||12;return String(h).padStart(2,"0")+":"+p[1]+ap;}
function fmtDate(v){if(!v)return "";var p=v.split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:v;}
function buildSheet(){
 var rows=S.rows.filter(function(r){return r.t||r.a||r.y||r.r||r.rd||r.p[0]||r.p[1];});
 var body=rows.map(function(r){
  var ph="";
  if(r.p[0]||r.p[1]){ph='<div class="ph">'+[0,1].map(function(s){return '<div class="fr">'+(r.p[s]?'<img src="'+r.p[s]+'" alt="">':'')+'</div>';}).join("")+'</div>';}
  return '<tr><td>'+esc(fmtTime(r.t))+'</td><td>'+esc(r.a)+'</td><td>'+esc(r.y)+'</td><td>'+esc(remarkText(r))+'</td><td>'+ph+'</td></tr>';
 }).join("");
 document.getElementById("sheet").innerHTML=
 '<table class="pg"><thead><tr><td><div class="sp"></div></td></tr></thead><tbody><tr><td class="pgc">'+
 '<div class="t1">SITE INSPECTION REPORT</div><div class="t2">Issues Log with Photographic Evidence</div>'+
 '<table class="it"><colgroup><col style="width:110pt"><col style="width:265pt"><col style="width:110pt"><col style="width:265pt"></colgroup>'+
 '<tr><td class="l">Project / Site:</td><td class="v">'+esc(S.proj)+'</td><td class="l">Report No.:</td><td class="v">'+esc(S.rep)+'</td></tr>'+

 var file=new File([bytes],name,{type:mime});
 if(window.matchMedia("(pointer:coarse)").matches&&navigator.canShare&&navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file],title:name});return;}catch(e){if(e&&e.name==="AbortError")return;}

 var url=URL.createObjectURL(file),im=await loadImg(url);URL.revokeObjectURL(url);

 function bgAt(x,y){var fx=x/B-.5,fy=y/B-.5,x0=Math.max(0,Math.min(bx-1,Math.floor(fx))),y0=Math.max(0,Math.min(by-1,Math.floor(fy))),x1=Math.min(bx-1,x0+1),y1=Math.min(by-1,y0+1),tx=Math.max(0,Math.min(1,fx-x0)),ty=Math.max(0,Math.min(1,fy-y0));
  return (bg[y0*bx+x0]*(1-tx)+bg[y0*bx+x1]*tx)*(1-ty)+(bg[y1*bx+x0]*(1-tx)+bg[y1*bx+x1]*tx)*ty;}
 var minx=w,miny=h,maxx=-1,maxy=-1;
